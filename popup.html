<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Scam Shield</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <header>
      <div class="header-text">
        <div class="eyebrow">SCAM SHIELD</div>
        <div class="eyebrow eyebrow--dim">MESSAGE SCANNER</div>
      </div>
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">
        <span id="themeToggleLabel">DARK</span>
      </button>
    </header>

    <div class="rule"></div>

    <label class="field-label" for="input">SAMPLE INPUT</label>
    <textarea id="input" maxlength="5000" placeholder="Paste a suspicious email, text, or message..."></textarea>

    <button id="analyzeBtn" class="scan-button">Scan message</button>

    <p id="errorMessage" class="error-message hidden" role="alert"></p>

    <div id="result" class="result hidden">
      <div class="result-row">
        <span class="field-label">RISK READING</span>
        <span id="scoreText" class="score-text">— / 100</span>
      </div>

      <div class="gauge">
        <div id="gaugeFill" class="gauge-fill"></div>
        <div id="gaugeMarker" class="gauge-marker"></div>
      </div>

      <p id="summary" class="summary"></p>

      <div class="field-label field-label--spaced">FLAGS DETECTED</div>
      <ul id="flags" class="flags"></ul>

      <div id="evidenceSection" class="evidence-section hidden">
        <div class="field-label field-label--spaced">EVIDENCE IN MESSAGE</div>
        <p class="evidence-hint">Select an item to locate it in the message.</p>
        <div id="evidenceList" class="evidence-list"></div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
