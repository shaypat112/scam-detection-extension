<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Scam Shield</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <header>
      <span class="logo">🛡️</span>
      <h1>Scam Shield</h1>
    </header>

    <p class="subtitle">Paste a suspicious email, text, or link below.</p>

    <textarea id="input" placeholder="Paste the message here..."></textarea>

    <button id="analyzeBtn">Analyze</button>

    <div id="result" class="result hidden"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
